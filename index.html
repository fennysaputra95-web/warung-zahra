<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Zahra - Kasir & Stok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5-QRCode Scanner Library CDN -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* Sembunyikan elemen aplikasi saat cetak, dan tampilkan KHUSUS struk */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print, header, nav, main, #modal-struk { 
                display: none !important; 
            }
            #area-struk-print { 
                display: block !important;
                width: 100% !important;
                max-width: 58mm; /* Ukuran standar kertas nota thermal */
                margin: 0 auto;
                padding: 0;
                font-family: 'Courier New', Courier, monospace;
                font-size: 11px;
                color: #000 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20 md:pb-6">

    <!-- HEADER / NAVBAR -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40 no-print">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-store text-xl"></i>
                <h1 class="font-bold text-lg tracking-wide">Warung Zahra</h1>
            </div>
            <div class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-medium">
                Kasir & Inventaris
            </div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="bg-white border-b border-slate-200 sticky top-[52px] z-30 shadow-sm no-print">
        <div class="max-w-4xl mx-auto flex text-center font-semibold text-sm">
            <button id="tab-btn-kasir" onclick="gantiTab('kasir')" class="flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-cash-register"></i> Kasir
            </button>
            <button id="tab-btn-stok" onclick="gantiTab('stok')" class="flex-1 py-3 text-slate-500 hover:text-indigo-600 border-b-2 border-transparent flex items-center justify-center gap-2">
                <i class="fa-solid fa-boxes-stacked"></i> Kelola Stok
            </button>
            <button id="tab-btn-laporan" onclick="gantiTab('laporan')" class="flex-1 py-3 text-slate-500 hover:text-indigo-600 border-b-2 border-transparent flex items-center justify-center gap-2">
                <i class="fa-solid fa-chart-line"></i> Laporan
            </button>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto p-4 no-print">

        <!-- ==================== TAB 1: KASIR ==================== -->
        <section id="tab-kasir" class="block space-y-4">
            
            <!-- Notifikasi Scan -->
            <div id="notif-scan-kasir" class="hidden text-center text-xs font-bold p-2 rounded shadow transition"></div>

            <!-- Kamera & Pencarian -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" id="search-kasir" oninput="muatProdukKasir()" placeholder="Cari nama atau scan barcode..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="toggleKameraKasir()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-camera"></i>
                        <span id="text-btn-kamera-kasir">Buka Kamera</span>
                    </button>
                </div>

                <!-- Video Stream Scanner -->
                <div id="wrapper-kamera-kasir" class="hidden overflow-hidden rounded-lg border-2 border-indigo-500 bg-black">
                    <div id="reader-kasir" class="w-full"></div>
                </div>
            </div>

            <!-- Grid Daftar Barang Kasir -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-700 mb-3 flex justify-between items-center">
                    <span>Pilih Produk</span>
                    <span id="total-jenis-barang" class="text-xs font-normal text-slate-500">0 Produk</span>
                </h2>
                <div id="grid-produk-kasir" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-64 overflow-y-auto p-1">
                    <!-- Item produk disuntik via JS -->
                </div>
            </div>

            <!-- Keranjang Belanja -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping text-indigo-600"></i> Keranjang
                    </h2>
                    <button onclick="kosongkanKeranjang()" class="text-xs text-red-500 hover:underline">Kosongkan</button>
                </div>

                <div id="list-keranjang" class="divide-y divide-slate-100 max-h-48 overflow-y-auto">
                    <!-- Item keranjang disuntik via JS -->
                </div>

                <!-- Summary & Pembayaran Tunai -->
                <div class="pt-3 border-t border-slate-200 space-y-3">
                    <div class="flex justify-between items-center text-slate-700 text-sm">
                        <span class="font-medium">Total Harga</span>
                        <span id="total-harga" class="font-bold text-indigo-600 text-xl">Rp 0</span>
                    </div>

                    <!-- Input Uang Tunai & Kembalian -->
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                        <div class="flex justify-between items-center gap-2">
                            <label class="text-xs font-bold text-slate-600">Uang Tunai (Rp):</label>
                            <button onclick="setUangPas()" class="text-[11px] bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-2 py-0.5 rounded">
                                Uang Pas
                            </button>
                        </div>
                        <input type="number" id="input-tunai" oninput="hitungKembalian()" placeholder="Masukkan nominal pembayaran..." class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        
                        <div class="flex justify-between items-center pt-1 text-sm">
                            <span class="font-medium text-slate-600">Kembalian:</span>
                            <span id="text-kembalian" class="font-bold text-slate-800">Rp 0</span>
                        </div>
                    </div>

                    <button onclick="prosesTransaksi()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-200 flex items-center justify-center gap-2 text-sm transition">
                        <i class="fa-solid fa-paper-plane"></i> Selesaikan Transaksi
                    </button>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 2: KELOLA STOK ==================== -->
        <section id="tab-stok" class="hidden space-y-4">
            
            <!-- Notifikasi Scan Stok -->
            <div id="notif-scan-stok" class="hidden text-center text-xs font-bold p-2 rounded shadow transition"></div>

            <!-- Form Tambah/Edit Barang -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h2 id="form-stok-title" class="font-bold text-slate-800 text-sm border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-600"></i> Tambah / Edit Barang
                </h2>
                
                <form id="form-barang" onsubmit="simpanBarang(event)" class="space-y-3">
                    <input type="hidden" id="barang-id">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Kode Barcode</label>
                        <div class="flex gap-2">
                            <input type="text" id="barang-code" placeholder="Scan / ketik barcode" class="flex-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <button type="button" onclick="toggleKameraStok()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-1">
                                <i class="fa-solid fa-barcode"></i>
                                <span id="text-btn-kamera-stok">Scan</span>
                            </button>
                        </div>
                    </div>

                    <!-- Kamera Stok -->
                    <div id="wrapper-kamera-stok" class="hidden overflow-hidden rounded-lg border-2 border-indigo-500 bg-black">
                        <div id="reader-stok" class="w-full"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nama Barang *</label>
                        <input type="text" id="barang-nama" required placeholder="Contoh: Minyak Goreng 1L" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Harga (Rp) *</label>
                            <input type="number" id="barang-harga" required min="0" placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Stok *</label>
                            <input type="number" id="barang-stok" required min="0" placeholder="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-semibold transition">
                            Simpan Barang
                        </button>
                        <button type="button" onclick="resetFormStok()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm transition">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabel Daftar Stok -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="font-bold text-slate-800 text-sm">Daftar Inventaris</h2>
                    <input type="text" id="search-stok" oninput="muatTabelStok()" placeholder="Filter stok..." class="px-2.5 py-1 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none">
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-100 text-slate-700 uppercase font-semibold">
                            <tr>
                                <th class="p-2.5">Barang</th>
                                <th class="p-2.5">Harga</th>
                                <th class="p-2.5 text-center">Stok</th>
                                <th class="p-2.5 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-stok-body" class="divide-y divide-slate-100">
                            <!-- Data disuntik via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 3: LAPORAN ==================== -->
        <section id="tab-laporan" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="font-bold text-slate-800 text-sm">Riwayat Penjualan</h2>
                    <button onclick="hapusSemuaLaporan()" class="text-xs text-red-500 hover:underline">Hapus Riwayat</button>
                </div>

                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                        <div class="text-xs text-indigo-600 font-medium">Total Transaksi</div>
                        <div id="stat-total-tx" class="text-lg font-bold text-indigo-900">0</div>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                        <div class="text-xs text-emerald-600 font-medium">Pendapatan</div>
                        <div id="stat-total-omset" class="text-lg font-bold text-emerald-900">Rp 0</div>
                    </div>
                </div>

                <div id="list-laporan" class="divide-y divide-slate-100 max-h-96 overflow-y-auto pt-2">
                    <!-- Item laporan disuntik via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- ==================== MODAL STRUK (LAYAR HP/LAPTOP) ==================== -->
    <div id="modal-struk" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="text-center">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 class="font-bold text-slate-800 text-lg">Transaksi Berhasil!</h3>
                <p class="text-xs text-slate-500">Preview struk pembayaran di bawah ini:</p>
            </div>

            <!-- Preview Struk Visual di Layar -->
            <div id="preview-struk-modal" class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs font-mono text-slate-800 max-h-60 overflow-y-auto space-y-1">
                <!-- Disuntik via JS -->
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="cetakStruk()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-print"></i> Cetak Struk
                </button>
                <button onclick="tutupModalStruk()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <!-- AREA STRUK KHUSUS PRINT (DITAMPILKAN KETIKA DITETAK KE PRINTER) -->
    <div id="area-struk-print" class="hidden">
        <!-- Disuntik via JS -->
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // --- DATA STATE (LOCAL STORAGE) ---
        let produkList = JSON.parse(localStorage.getItem('wz_produk')) || [
            { id: 1, code: "8999999001", name: "Aqua 600ml", price: 3500, stock: 24 },
            { id: 2, code: "8999999002", name: "Indomie Goreng", price: 3000, stock: 40 },
            { id: 3, code: "8999999003", name: "Kopi Kapal Api", price: 2000, stock: 30 }
        ];

        let keranjang = [];
        let laporanList = JSON.parse(localStorage.getItem('wz_laporan')) || [];

        // Variable Instance Scanner
        let html5QrCodeKasir = null;
        let html5QrCodeStok = null;
        let isProcessingScanKasir = false;

        // --- DEFAULTS & INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            simpanLocalProduk();
            muatProdukKasir();
            muatTabelStok();
            muatLaporan();
        });

        function simpanLocalProduk() {
            localStorage.setItem('wz_produk', JSON.stringify(produkList));
        }

        function simpanLocalLaporan() {
            localStorage.setItem('wz_laporan', JSON.stringify(laporanList));
        }

        function formatRupiah(angka) {
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        // --- FUNGSI TAB NAVIGASI ---
        function gantiTab(tabName) {
            matikanSemuaKamera();
            
            ['kasir', 'stok', 'laporan'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`tab-btn-${tab}`).className = "flex-1 py-3 text-slate-500 hover:text-indigo-600 border-b-2 border-transparent flex items-center justify-center gap-2";
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tabName}`).className = "flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold flex items-center justify-center gap-2";

            if (tabName === 'kasir') muatProdukKasir();
            if (tabName === 'stok') muatTabelStok();
            if (tabName === 'laporan') muatLaporan();
        }

        // --- OPTIMASI KAMERA SCANNER ---
        function matikanSemuaKamera() {
            if (html5QrCodeKasir) {
                html5QrCodeKasir.stop().then(() => {
                    html5QrCodeKasir.clear();
                    html5QrCodeKasir = null;
                }).catch(() => { html5QrCodeKasir = null; });
                document.getElementById('wrapper-kamera-kasir').classList.add('hidden');
                document.getElementById('text-btn-kamera-kasir').innerText = "Buka Kamera";
            }

            if (html5QrCodeStok) {
                html5QrCodeStok.stop().then(() => {
                    html5QrCodeStok.clear();
                    html5QrCodeStok = null;
                }).catch(() => { html5QrCodeStok = null; });
                document.getElementById('wrapper-kamera-stok').classList.add('hidden');
                document.getElementById('text-btn-kamera-stok').innerText = "Scan";
            }
        }

        async function toggleKameraKasir() {
            const wrapper = document.getElementById('wrapper-kamera-kasir');
            
            if (wrapper.classList.contains('hidden')) {
                matikanSemuaKamera();
                wrapper.classList.remove('hidden');
                document.getElementById('text-btn-kamera-kasir').innerText = "Tutup Kamera";

                html5QrCodeKasir = new Html5Qrcode("reader-kasir");
                const config = { 
                    fps: 10, 
                    qrbox: { width: 250, height: 150 },
                    videoConstraints: {
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };

                try {
                    await html5QrCodeKasir.start({ facingMode: "environment" }, config, onScanSuccessKasir);
                } catch (err) {
                    alert("Gagal membuka kamera: " + err);
                    matikanSemuaKamera();
                }
            } else {
                matikanSemuaKamera();
            }
        }

        function onScanSuccessKasir(decodedText) {
            if (isProcessingScanKasir) return;
            isProcessingScanKasir = true;

            const berhasil = tambahBarangLewatKode(decodedText);
            const notif = document.getElementById('notif-scan-kasir');

            if (berhasil) {
                notif.innerText = `✅ Berhasil menambah item (${decodedText})`;
                notif.className = "mb-2 p-2 bg-emerald-500 text-white text-xs font-bold rounded shadow transition block";
            } else {
                notif.innerText = `❌ Barang tidak ditemukan (${decodedText})`;
                notif.className = "mb-2 p-2 bg-red-500 text-white text-xs font-bold rounded shadow transition block";
            }

            setTimeout(() => {
                notif.className = "hidden";
                isProcessingScanKasir = false;
            }, 1200);
        }

        async function toggleKameraStok() {
            const wrapper = document.getElementById('wrapper-kamera-stok');
            
            if (wrapper.classList.contains('hidden')) {
                matikanSemuaKamera();
                wrapper.classList.remove('hidden');
                document.getElementById('text-btn-kamera-stok').innerText = "Tutup";

                html5QrCodeStok = new Html5Qrcode("reader-stok");
                const config = { 
                    fps: 10, 
                    qrbox: { width: 200, height: 120 },
                    videoConstraints: {
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };

                try {
                    await html5QrCodeStok.start({ facingMode: "environment" }, config, onScanSuccessStok);
                } catch (err) {
                    alert("Gagal membuka kamera: " + err);
                    matikanSemuaKamera();
                }
            } else {
                matikanSemuaKamera();
            }
        }

        function onScanSuccessStok(decodedText) {
            document.getElementById('barang-code').value = decodedText;
            const notif = document.getElementById('notif-scan-stok');
            notif.innerText = `✅ Barcode Terisi: ${decodedText}`;
            notif.className = "mb-2 p-1.5 bg-emerald-500 text-white text-xs font-bold rounded shadow transition block";

            setTimeout(() => {
                notif.className = "hidden";
                matikanSemuaKamera();
            }, 800);
        }

        // --- FUNGSI TAB KASIR ---
        function muatProdukKasir() {
            const query = document.getElementById('search-kasir').value.toLowerCase();
            const grid = document.getElementById('grid-produk-kasir');
            grid.innerHTML = '';

            const filtered = produkList.filter(p => 
                p.name.toLowerCase().includes(query) || (p.code && p.code.toLowerCase().includes(query))
            );

            document.getElementById('total-jenis-barang').innerText = `${filtered.length} Produk`;

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-4">Produk tidak ditemukan</p>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.onclick = () => tambahKeKeranjang(p.id);
                card.className = `p-3 rounded-lg border text-left cursor-pointer transition hover:shadow-md ${p.stock > 0 ? 'bg-slate-50 border-slate-200 hover:border-indigo-400' : 'bg-red-50 border-red-100 opacity-60'}`;
                card.innerHTML = `
                    <div class="font-bold text-xs text-slate-800 truncate">${p.name}</div>
                    <div class="text-xs text-indigo-600 font-semibold mt-1">${formatRupiah(p.price)}</div>
                    <div class="text-[10px] ${p.stock > 0 ? 'text-slate-500' : 'text-red-600 font-bold'} mt-0.5">Stok: ${p.stock}</div>
                `;
                grid.appendChild(card);
            });
        }

        function tambahKeKeranjang(id) {
            const produk = produkList.find(p => Number(p.id) === Number(id));
            if (!produk) return;

            if (produk.stock <= 0) {
                alert("Stok barang ini habis!");
                return;
            }

            const itemInCart = keranjang.find(k => Number(k.id) === Number(id));
            if (itemInCart) {
                if (itemInCart.qty >= produk.stock) {
                    alert("Jumlah melebihi stok yang tersedia!");
                    return;
                }
                itemInCart.qty += 1;
            } else {
                keranjang.push({ id: produk.id, name: produk.name, price: produk.price, qty: 1 });
            }

            muatKeranjang();
        }

        function tambahBarangLewatKode(code) {
            const produk = produkList.find(p => p.code && p.code.trim() === code.trim());
            if (produk) {
                tambahKeKeranjang(produk.id);
                return true;
            }
            return false;
        }

        function muatKeranjang() {
            const list = document.getElementById('list-keranjang');
            list.innerHTML = '';
            let total = 0;

            if (keranjang.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Keranjang masih kosong</p>`;
                document.getElementById('total-harga').innerText = formatRupiah(0);
                document.getElementById('input-tunai').value = '';
                hitungKembalian();
                return;
            }

            keranjang.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;

                const row = document.createElement('div');
                row.className = "py-2 flex justify-between items-center text-xs";
                row.innerHTML = `
                    <div class="flex-1 pr-2">
                        <div class="font-bold text-slate-800">${item.name}</div>
                        <div class="text-slate-500">${formatRupiah(item.price)} x ${item.qty}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-700">${formatRupiah(subtotal)}</span>
                        <div class="flex items-center border border-slate-300 rounded overflow-hidden">
                            <button onclick="ubahQty(${item.id}, -1)" class="px-2 py-0.5 bg-slate-100 text-slate-600 hover:bg-slate-200">-</button>
                            <span class="px-2 font-semibold text-slate-700">${item.qty}</span>
                            <button onclick="ubahQty(${item.id}, 1)" class="px-2 py-0.5 bg-slate-100 text-slate-600 hover:bg-slate-200">+</button>
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });

            document.getElementById('total-harga').innerText = formatRupiah(total);
            hitungKembalian();
        }

        function getTotalHarga() {
            return keranjang.reduce((total, item) => total + (item.price * item.qty), 0);
        }

        function hitungKembalian() {
            const total = getTotalHarga();
            const tunai = Number(document.getElementById('input-tunai').value) || 0;
            const elemKembalian = document.getElementById('text-kembalian');

            if (tunai === 0) {
                elemKembalian.innerText = formatRupiah(0);
                elemKembalian.className = "font-bold text-slate-800";
                return;
            }

            const kembalian = tunai - total;
            if (kembalian >= 0) {
                elemKembalian.innerText = formatRupiah(kembalian);
                elemKembalian.className = "font-bold text-emerald-600";
            } else {
                elemKembalian.innerText = `Kurang ${formatRupiah(Math.abs(kembalian))}`;
                elemKembalian.className = "font-bold text-red-500";
            }
        }

        function setUangPas() {
            const total = getTotalHarga();
            document.getElementById('input-tunai').value = total > 0 ? total : '';
            hitungKembalian();
        }

        function ubahQty(id, delta) {
            const item = keranjang.find(k => Number(k.id) === Number(id));
            const produk = produkList.find(p => Number(p.id) === Number(id));

            if (item && produk) {
                if (delta > 0 && item.qty >= produk.stock) {
                    alert("Stok tidak mencukupi!");
                    return;
                }
                item.qty += delta;
                if (item.qty <= 0) {
                    keranjang = keranjang.filter(k => Number(k.id) !== Number(id));
                }
            }
            muatKeranjang();
        }

        function kosongkanKeranjang() {
            keranjang = [];
            document.getElementById('input-tunai').value = '';
            muatKeranjang();
        }

        function prosesTransaksi() {
            if (keranjang.length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }

            const totalTx = getTotalHarga();
            const tunai = Number(document.getElementById('input-tunai').value) || 0;

            if (tunai < totalTx) {
                alert(`Uang tunai kurang! Kurang ${formatRupiah(totalTx - tunai)}`);
                return;
            }

            const kembalian = tunai - totalTx;

            keranjang.forEach(item => {
                const produk = produkList.find(p => Number(p.id) === Number(item.id));
                if (produk) {
                    produk.stock -= item.qty;
                }
            });

            const transaksiBaru = {
                id: Date.now(),
                waktu: new Date().toLocaleString('id-ID'),
                items: [...keranjang],
                total: totalTx,
                tunai: tunai,
                kembalian: kembalian
            };

            laporanList.unshift(transaksiBaru);
            
            simpanLocalProduk();
            simpanLocalLaporan();

            // Tampilkan Modal Struk & Siapkan Layout Cetak
            bukaModalStruk(transaksiBaru);

            kosongkanKeranjang();
            muatProdukKasir();
        }

        // --- FUNGSI CETAK STRUK PERBAIKAN ---
        function bukaModalStruk(tx) {
            const previewModal = document.getElementById('preview-struk-modal');
            const areaPrint = document.getElementById('area-struk-print');

            let itemRows = tx.items.map(i => `
                <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                    <span>${i.name} (${i.qty}x)</span>
                    <span>${formatRupiah(i.price * i.qty)}</span>
                </div>
            `).join('');

            let htmlStruk = `
                <div style="text-align: center; font-weight: bold; margin-bottom: 5px;">
                    <div style="font-size: 14px;">WARUNG ZAHRA</div>
                    <div style="font-size: 10px; font-weight: normal;">Sedia Sembako & Kebutuhan Harian</div>
                </div>
                <div style="border-bottom: 1px dashed #000; margin: 6px 0;"></div>
                <div style="font-size: 10px; margin-bottom: 6px;">Tgl: ${tx.waktu}</div>
                <div>${itemRows}</div>
                <div style="border-bottom: 1px dashed #000; margin: 6px 0;"></div>
                <div style="display: flex; justify-content: space-between; font-weight: bold;">
                    <span>TOTAL</span>
                    <span>${formatRupiah(tx.total)}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Bayar</span>
                    <span>${formatRupiah(tx.tunai)}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Kembali</span>
                    <span>${formatRupiah(tx.kembalian)}</span>
                </div>
                <div style="border-bottom: 1px dashed #000; margin: 6px 0;"></div>
                <div style="text-align: center; font-size: 10px; margin-top: 6px;">
                    *** Terima Kasih ***<br>Selamat Berbelanja Kembali
                </div>
            `;

            previewModal.innerHTML = htmlStruk;
            areaPrint.innerHTML = htmlStruk;
            document.getElementById('modal-struk').classList.remove('hidden');
        }

        function cetakStruk() {
            window.print();
        }

        function tutupModalStruk() {
            document.getElementById('modal-struk').classList.add('hidden');
        }

        // --- FUNGSI TAB STOK ---
        function muatTabelStok() {
            const query = document.getElementById('search-stok').value.toLowerCase();
            const body = document.getElementById('tabel-stok-body');
            body.innerHTML = '';

            const filtered = produkList.filter(p => 
                p.name.toLowerCase().includes(query) || (p.code && p.code.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400">Belum ada barang</td></tr>`;
                return;
            }

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-50 hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-2.5">
                        <div class="font-bold text-slate-800">${p.name}</div>
                        <div class="text-[10px] text-slate-400">${p.code || 'Tanpa Barcode'}</div>
                    </td>
                    <td class="p-2.5 font-medium">${formatRupiah(p.price)}</td>
                    <td class="p-2.5 text-center font-bold ${p.stock <= 5 ? 'text-red-500' : 'text-slate-700'}">${p.stock}</td>
                    <td class="p-2.5 text-center">
                        <button onclick="editBarang(${p.id})" class="text-indigo-600 hover:text-indigo-800 mr-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="hapusBarang(${p.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                body.appendChild(tr);
            });
        }

        function simpanBarang(e) {
            e.preventDefault();
            const id = document.getElementById('barang-id').value;
            const code = document.getElementById('barang-code').value.trim();
            const name = document.getElementById('barang-nama').value.trim();
            const price = Number(document.getElementById('barang-harga').value);
            const stock = Number(document.getElementById('barang-stok').value);

            if (id) {
                const produk = produkList.find(p => Number(p.id) === Number(id));
                if (produk) {
                    produk.code = code;
                    produk.name = name;
                    produk.price = price;
                    produk.stock = stock;
                }
            } else {
                const newBarang = { id: Date.now(), code, name, price, stock };
                produkList.unshift(newBarang);
            }

            simpanLocalProduk();
            resetFormStok();
            muatTabelStok();
            muatProdukKasir();
        }

        function editBarang(id) {
            const p = produkList.find(item => Number(item.id) === Number(id));
            if (!p) return;

            document.getElementById('barang-id').value = p.id;
            document.getElementById('barang-code').value = p.code || '';
            document.getElementById('barang-nama').value = p.name;
            document.getElementById('barang-harga').value = p.price;
            document.getElementById('barang-stok').value = p.stock;
            
            document.getElementById('form-stok-title').innerHTML = `<i class="fa-solid fa-pen text-indigo-600"></i> Edit Barang`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hapusBarang(id) {
            if (confirm("Yakin ingin menghapus barang ini?")) {
                produkList = produkList.filter(p => Number(p.id) !== Number(id));
                simpanLocalProduk();
                muatTabelStok();
                muatProdukKasir();
            }
        }

        function resetFormStok() {
            document.getElementById('form-barang').reset();
            document.getElementById('barang-id').value = '';
            document.getElementById('form-stok-title').innerHTML = `<i class="fa-solid fa-plus-circle text-indigo-600"></i> Tambah / Edit Barang`;
            matikanSemuaKamera();
        }

        // --- FUNGSI TAB LAPORAN ---
        function muatLaporan() {
            const list = document.getElementById('list-laporan');
            list.innerHTML = '';

            let omset = 0;
            document.getElementById('stat-total-tx').innerText = laporanList.length;

            if (laporanList.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Belum ada riwayat transaksi</p>`;
                document.getElementById('stat-total-omset').innerText = formatRupiah(0);
                return;
            }

            laporanList.forEach(tx => {
                omset += tx.total;
                const div = document.createElement('div');
                div.className = "py-3 space-y-1 text-xs border-b border-slate-100";
                
                let itemStr = tx.items.map(i => `${i.name} (${i.qty}x)`).join(', ');

                div.innerHTML = `
                    <div class="flex justify-between font-semibold text-slate-700">
                        <span>${tx.waktu}</span>
                        <span class="text-emerald-600">${formatRupiah(tx.total)}</span>
                    </div>
                    <div class="text-slate-500 text-[11px] truncate">${itemStr}</div>
                    <div class="flex justify-between items-center pt-1">
                        <span class="text-[10px] text-slate-400">Bayar: ${formatRupiah(tx.tunai)} | Kembali: ${formatRupiah(tx.kembalian)}</span>
                        <button onclick='bukaModalStruk(${JSON.stringify(tx)})' class="text-[11px] text-indigo-600 hover:underline font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-print"></i> Struk
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('stat-total-omset').innerText = formatRupiah(omset);
        }

        function hapusSemuaLaporan() {
            if (confirm("Hapus semua riwayat transaksi?")) {
                laporanList = [];
                simpanLocalLaporan();
                muatLaporan();
            }
        }
    </script>
</body>
</html>
